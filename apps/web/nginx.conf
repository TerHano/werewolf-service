server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The API and the SignalR hub are proxied so the browser only ever sees one origin. Without
  # this the frontend would need an absolute backend URL compiled into it, and the server would
  # need a matching CORS entry for every environment.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SignalR negotiates over HTTP and then upgrades to a WebSocket. Without the Upgrade and
  # Connection headers the upgrade fails and the client silently falls back to long polling —
  # or, with WebSockets forced, does not connect at all.
  location /Events {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache off;
    # A hub connection is long-lived and mostly idle; the default 60s read timeout would cut it.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Hashed asset filenames are safe to cache hard; index.html must not be, or clients keep
  # loading an old bundle after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths are routes like /room/AB12C, not missing files.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
