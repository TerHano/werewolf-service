# Production overlay: run the images published by CI instead of building from source.
#
#   docker compose -f compose.yaml -f compose.prod.yaml pull
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# Set every secret in the host's .env — the committed one holds development values only.
#
# TLS and the public hostname are not this stack's job. A separate Caddy container owns
# :80/:443 on the host and reaches the web container over the shared `caddy_net` network, so
# nothing here publishes a port. See the Caddyfile snippet in README's Deployment section.

services:
  api:
    image: ghcr.io/terhano/werewolfparty-api:latest
    build: !reset null
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Only ever consulted if the app is served from a different host than the API. It is not
      # today — Caddy and nginx put the bundle and /api on one origin, so the browser makes no
      # cross-origin request and this policy is never reached. Kept correct rather than
      # required: a stale value here would mislead whoever does split the hosts, but a missing
      # one must not fail a deploy over a setting nothing reads.
      AllowedOrigins: ${PUBLIC_ORIGIN:-https://werewolfparty.terhano.com}

  web:
    image: ghcr.io/terhano/werewolfparty-web:latest
    build: !reset null
    # Caddy is the only thing that should be able to reach this. Publishing 8080 as well would
    # leave a plaintext copy of the whole app open on the host's public IP.
    ports: !reset []
    networks:
      # Naming any network drops the implicit default, and the default is how nginx here
      # resolves `api`. Both, then.
      default:
      caddy_net:
        # Compose would otherwise alias this container as plain `web` on a network shared with
        # every other site on the box. The alias is the name Caddy proxies to.
        aliases:
          - werewolf-party-web

networks:
  caddy_net:
    external: true
