name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # The host is an Ampere (arm64) machine, so the images only ever need to be arm64 — and an
    # ARM runner builds them natively. This used to be an x86 runner emulating arm64 through
    # QEMU, which took the best part of an hour for the .NET image alone.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    strategy:
      # Both images build from the same repo now, but they are independent — a failure in one
      # should not hide the result of the other.
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./apps/server
            dockerfile: apps/server/WerewolfParty-Server/Dockerfile
            image: werewolfparty-api
          - name: web
            context: ./apps/web
            dockerfile: apps/web/Dockerfile
            image: werewolfparty-web

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tag
        id: tag
        run: |
          IMAGE_ID=$(echo "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}" | tr '[:upper:]' '[:lower:]')

          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          [ "$VERSION" == "main" ] && VERSION=latest

          echo "tags=$IMAGE_ID:$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # arm64 only: the deploy pulls and never builds, so an image is only useful to this
          # project if the Ampere host can run it. Add linux/amd64 back here (and QEMU above)
          # if these images ever have to run on an x86 box.
          platforms: linux/arm64
          # A pull request builds as a check and publishes nothing.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tag.outputs.tags }}
          build-args: |
            BUILD_CONFIGURATION=${{ vars.BUILD_CONFIGURATION || 'Release' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The server runs published images and builds nothing, so it has no use for the source —
      # only for the two files that describe the stack. Sending just those keeps
      # compose.override.yaml, which is the development stack and would be picked up by any
      # bare `docker compose` typed on the box, off the machine entirely.
      - name: Send compose files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_KEY }}
          port: ${{ secrets.ORACLE_PORT }}
          source: compose.yaml,compose.prod.yaml
          target: /srv/werewolf-party

      - name: Update server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_KEY }}
          port: ${{ secrets.ORACLE_PORT }}
          # Without this the script runs on regardless of what fails, and the job reports a
          # green deploy having changed nothing.
          script_stop: true
          script: |
            cd /srv/werewolf-party

            # caddy_net belongs to the Caddy stack, not this one, so compose treats it as
            # external and refuses to start if it is missing. Creating it here means the order
            # the two stacks first come up in does not matter.
            docker network inspect caddy_net >/dev/null 2>&1 || docker network create caddy_net

            # Both files, every time. compose.prod.yaml is an overlay — it carries only the
            # published images and drops the build sections — so on its own it has no database
            # and no configuration at all.
            docker compose -f compose.yaml -f compose.prod.yaml pull
            docker compose -f compose.yaml -f compose.prod.yaml up -d --remove-orphans

            # The previous release's images are still on disk after an update, and the boot
            # volume on these shapes is small enough to notice.
            docker image prune -f
